<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courserve</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Courserve</h1>
        <p>Plan your semester.</p>

        <button id="add-course-btn">Add Course</button>

        <div id="course-form" style="display: none;">
            <input id="course-code" type="text" placeholder="Course code">
            <input id="course-name" type="text" placeholder="Course name">
            <input id="course-credits" type="number" min="1" max="12" value="3" placeholder="Credits">

<select id="course-status">
    <option value="Planned">Planned</option>
    <option value="In Progress">In Progress</option>
    <option value="Completed">Completed</option>
</select>
            <button id="save-course-btn">Save Course</button>
        </div>

        <div id="semester-summary">
    <span id="total-courses">0 courses</span>
    <span id="total-credits">0 credits</span>
    <span id="completed-credits">0 completed</span>
</div>

<input
    id="course-search"
    type="text"
    placeholder="Search courses..."
>
        <div id="course-list"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
